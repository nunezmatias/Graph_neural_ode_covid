<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 2: Complete Analysis</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --text-main: #e0e6ed;
            --accent: #58a6ff;
            --border: #2d333b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #58a6ff, #ff7b72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 50px;
            opacity: 0.7;
            font-size: 1.2rem;
        }

        .state-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 40px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .state-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plot-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .plot-container {
            position: relative;
        }

        .plot-img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .plot-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--border);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h1>Test 2: Linear vs Log Analysis</h1>
    <div class="subtitle">Comparison of Model Performance across Scales • Latent 3 Refined</div>

    <!-- Generated Grid -->
    <div id="grid-content">
        <!-- States will be injected here -->
    </div>

    <footer>Generated by Graph Neural ODE Analysis Suite</footer>

    <script>
        const states = ["NY", "OH", "NJ", "GA", "IL", "FL", "CA", "VA", "TX", "NC"];
        const container = document.getElementById('grid-content');

        states.forEach(state => {
            const html = `
                <div class="state-container">
                    <div class="state-header">State: ${state}</div>
                    <div class="plot-row">
                        <div class="plot-container">
                            <div class="plot-label">LINEAR SCALE (Real Cases)</div>
                            <img src="test-2/Latent_3/plots/full_pred_${state}.png" class="plot-img" alt="${state} Linear">
                        </div>
                        <div class="plot-container">
                            <div class="plot-label">LOG SCALE (Normalized)</div>
                            <img src="test-2/Latent_3/plots_log/log_pred_${state}.png" class="plot-img" alt="${state} Log">
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    </script>
</body>

</html>
